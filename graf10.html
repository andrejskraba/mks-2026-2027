<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graf</title>
</head>
<body>
Primer z grafom
<br>

<canvas id="platno-2" width="800" height="100" style="border: 1px dashed #099999;"></canvas>
<br>

<script>
"use strict"; // obvezna deklaracija spremenljivk

let can2, plat2; // deklariramo dve novi spremenljivki za platno ("canvas") in kontekst ctx -> plat1

// "boilerplate" koda za platno
can2 = document.getElementById("platno-2"); // v html delu poiščemo platno-2, spremenljivka can2 sedaj predstavlja objekt platna
plat2 =  can2.getContext("2d"); // od tu dalje delamo s spremenljivko plat1 (za izris na platnu z id "platno-2")

let maksGrafX = can2.width; // določimo maksimalno širino grafa, ki je enaka širini platna
let maksGrafY = can2.height; // določimo maksimalno višino grafa, ki je enaka višini platn

plat2.strokeStyle = "#ff0000"; // določimo barvo črte, hex oblika #rrggbb

let x = new Array(); // deklariramo "array" oz. polje x, lahko bi zapisali tudi x = []; oglati oklepaji označujejo spremenljivko tipa "array"
let y = new Array(); // deklariramo "array" oz. polje y, lahko bi zapisali tudi y = []; oglati oklepaji označujejo spremenljivko tipa "array"

let časovnik; // spremenljivka za delo s funkcijo setTimeout

// inicializacija vrednosti v "array-u" x
// v "array" y zapišemo 800 naključnih vrednosti med 0 in 100
for(let i=0; i<can2.width; i++){
    x[i] = i; // za x zapišemo vrednosti [0, 1, 2, ...], t.j. vrednosti i-ja
}

function dodajVrednostAliBrišiInDodaj(yVrednost){
    // če je vektor y poln, odstranimo prvi element in dodamo nov naključni element na konec vektorja y, podobno kot v prejšnjem primeru
    if(y.length >= maksGrafX + 1){ // če je platno 10x10 imamo 11x11 točk, zato je tukaj +1
        y.shift() // odstranimo prvi element iz "array-a"
        y.push(yVrednost); // na konec "array-a" y dodamo novo naključno vrednost med 0 in 100    
    }
    else{
        y.push(yVrednost); // dokler "array" y ni poln vanj dodajamo oz. potiskamo ("push") nove naključne vrednosti med 0 in 100
    }
}

function izriši(yVrednost){
    dodajVrednostAliBrišiInDodaj(yVrednost); // dodamo novo vrednost v "array" y

    // brišemo platno
    plat2.clearRect(0, 0, can2.width, can2.height);

    plat2.beginPath();

    for(let i=0; i<y.length; i++){
        plat2.lineTo(x[i], can2.height - y[i]); // ker je y os orientirana v smeri navzdol moramo pretvoriti vrednosti, npr. iz 10 -> 90 | 100 - 10 = 90 | tokrat namesto fiksne vrednosti 100 uporabimo lastnost   višine platna t.j. can2.height
    }   

    plat2.stroke(); // za prikaz črte na platnu
}

function zanka(){

    izriši(Math.random() * 100); // izrišemo naključno vrednost med 0 in 100

    časovnik = setTimeout(zanka, 10); // ponovimo funkcijo zanka na vsakih 10 ms

}

zanka(); // zaženemo funkcijo zanka(), le-ta se izvede nato vsakih 10 ms s pomočjo funkcije setTimeout

</script>

</body>
</html>
