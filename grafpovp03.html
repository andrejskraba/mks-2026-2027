<head>

    <title>Graf</title>
</head>
<body>
Primer z grafom
<br>

<canvas id="platno-2" width="800" height="100" style="border: 1px dashed #099999;"></canvas>
<br>

<script>
"use strict"; // obvezna deklaracija spremenljivk

let can2, plat2; // deklariramo dve novi spremenljivki za platno ("canvas") in kontekst ctx -> plat1

let časovnik; // spremenljivka za delo s funkcijo setTimeout

let graf1; // spremenljivka za objekt razreda Graf

class GrafPovprečja{ // deklaracija razreda Graf
    constructor(idPlatna, maksGrafX, maksGrafY, dolžinaOkna){
        // "boilerplate" koda za platno
        this.can2 = document.getElementById(idPlatna); // v html delu poiščemo platno-2, spremenljivka can2 sedaj predstavlja objekt platna
        this.plat2 =  this.can2.getContext("2d"); // od tu dalje delamo s spremenljivko plat1 (za izris na platnu z id "platno-2")

        this.širinaPlatna = this.can2.width; // določimo maksimalno širino grafa, ki je enaka širini platna
        this.višinaPlatna = this.can2.height; // določimo maksimalno višino grafa, ki je enaka višini platn

        this.maksGrafX = maksGrafX; // maksimum po x-osi
        this.maksGrafY = maksGrafY; // maksimum po y-osi

        this.yOkno = new Array(); // polje ("array") za okno y vrednosti za izračun drsečega povprečja
        this.povprečnaVrednost = 0; // povprečna vrednost v oknu
        this.dolžinaOkna = dolžinaOkna; // dolžino okna pridobimo preko argumenta konstruktorja

        this.plat2.strokeStyle = "#ff0000"; // določimo barvo črte, hex oblika #rrggbb

        this.x = new Array(); // deklariramo "array" oz. polje x, lahko bi zapisali tudi x = []; oglati oklepaji označujejo spremenljivko tipa "array"
        this.y = new Array(); // deklariramo "array" oz. polje y, lahko bi zapisali tudi y = []; oglati oklepaji označujejo spremenljivko tipa "array"

        // inicializacija vrednosti v "array-u" x
        for(let i=0; i<this.maksGrafX + 1; i++){
            this.x[i] = i; // za x zapišemo vrednosti [0, 1, 2, ...], t.j. vrednosti i-ja
        }
    }

    dodajVrednostAliBrišiInDodaj(yVrednost){

    this.yOkno.push(yVrednost); // v okno y potisnemo vrednost posredovano preko argumenta funkcije dodajVrednostAliBrišiInDodaj()

    if(this.yOkno.length == this.dolžinaOkna + 1){ // če je okno polno, odstranimo prvi element in izračunamo povprečje
        this.yOkno.shift(); // odstranimo prvi element iz "array-a"
        let vsota = 0; // spremenljivka za vsoto vrednosti v oknu
        for(let i=0; i<this.yOkno.length; i++){
            vsota += this.yOkno[i]; // seštejemo vse vrednosti v oknu
        }
        this.povprečnaVrednost = vsota / this.yOkno.length; // izračunamo drseče povprečje 
        }
        else {
            this.povprečnaVrednost = 0; // do zapolnitve dolžine okna, t.j. npr. dokler ne napolnimo 50 vrednosti vrnemo vrednost 0
        }

        // če je vektor y poln, odstranimo prvi element in dodamo nov naključni element na konec vektorja y, podobno kot v prejšnjem primeru
        if(this.y.length >= this.maksGrafX + 1){ // če je platno 10x10 imamo 11x11 točk, zato je tukaj +1
            this.y.shift() // odstranimo prvi element iz "array-a"
            this.y.push(this.povprečnaVrednost); // na konec "array-a" y dodamo novo naključno vrednost med 0 in 100    
        }
        else{
            this.y.push(this.povprečnaVrednost); // dokler "array" y ni poln vanj dodajamo oz. potiskamo ("push") nove naključne vrednosti med 0 in 100
        }
    }

    izriši(yVrednost){
        this.dodajVrednostAliBrišiInDodaj(yVrednost); // dodamo novo vrednost v "array" y

        // brišemo platno
        this.plat2.clearRect(0, 0, this.širinaPlatna, this.višinaPlatna);

        this.plat2.beginPath();

        for(let i=0; i<this.y.length; i++){
            this.plat2.lineTo(this.x[i]/this.maksGrafX*this.širinaPlatna, this.višinaPlatna - this.y[i]/this.maksGrafY*this.višinaPlatna); // ker je y os orientirana v smeri navzdol moramo pretvoriti vrednosti, npr. iz 10 -> 90 | 100 - 10 = 90 | tokrat namesto fiksne vrednosti 100 uporabimo lastnost   višine platna t.j. can2.height
        }   

        this.plat2.stroke(); // za prikaz črte na platnu
    }
}

function zanka(){

    graf1.izriši(Math.random() * 100); // izrišemo naključno vrednost med 0 in 100

    časovnik = setTimeout(zanka, 10); // ponovimo funkcijo zanka na vsakih 10 ms

}

graf1 = new GrafPovprečja("platno-2", 800, 100, 50); // ustvarimo objekt razreda GrafPovprečja, arg: idPlatna, maks. vrednost po x, maks. vrednost po y, širina okna povprečenja (npr. 50 vrednosti)

zanka(); // zaženemo funkcijo zanka(), le-ta se izvede nato vsakih 10 ms s pomočjo funkcije setTimeout

</script>

</body>
</html>
